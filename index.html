<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DropCut</title>
    <style>
      :root {
        color-scheme: dark;
        background: #07080c;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #07080c;
      }

      #app {
        min-height: 100vh;
        background: #07080c;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(34, 211, 238, 0.18), transparent 28%),
          radial-gradient(circle at 38% 62%, rgba(99, 102, 241, 0.14), transparent 30%),
          #07080c;
        color: #e5e7eb;
        font-family: "Segoe UI", Inter, system-ui, sans-serif;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #boot-splash.boot-splash--hide {
        opacity: 0;
        visibility: hidden;
      }

      .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transform: translateY(-8px);
      }

      .boot-logo {
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        border: 1px solid rgba(125, 211, 252, 0.28);
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(14, 165, 233, 0.28), rgba(124, 58, 237, 0.26));
        box-shadow: 0 24px 70px rgba(14, 165, 233, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .boot-logo img {
        width: 40px;
        height: 40px;
      }

      .boot-title {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .boot-subtitle {
        margin: -8px 0 0;
        color: rgba(148, 163, 184, 0.85);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .boot-loader {
        width: 96px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.14);
      }

      .boot-loader::before {
        content: "";
        display: block;
        width: 38px;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22d3ee, #a78bfa);
        animation: boot-slide 1s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% { transform: translateX(-44px); }
        100% { transform: translateX(112px); }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-label="Loading DropCut">
      <div class="boot-card">
        <div class="boot-logo"><img src="/icons/128x128.png" alt="" /></div>
        <h1 class="boot-title">DropCut</h1>
        <p class="boot-subtitle">Local Video Compressor</p>
        <div class="boot-loader" aria-hidden="true"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
